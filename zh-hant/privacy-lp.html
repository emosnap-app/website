  <div class="wrap">

      <h1>隱私權政策（概要）</h1>
      <p>EmoSnap 以裝置本地儲存為核心，妥善處理您的照片與情緒記錄。以下是本頁面的簡要說明，詳細內容請參閱應用程式版隱私權政策。</p>

      <h2>收集的資訊</h2>
      <ul>
        <li>您記錄的照片與文字（儲存於您的裝置本地）</li>
        <li>匿名化的應用程式使用統計資料</li>
        <li>廣告所需的最少裝置資訊（僅在啟用廣告時）</li>
      </ul>

      <h2>使用目的</h2>
      <ul>
        <li>提供並改善應用程式功能</li>
        <li>分析使用情況以優化使用者體驗</li>
        <li>投放廣告（僅在啟用該功能時）</li>
      </ul>

      <p>如需了解資料處理、第三方共用、您的權利及聯絡方式的完整說明，請參閱<a href="privacy-app.html">應用程式版隱私權政策（詳細）</a>。</p>

      <p>聯絡方式：emosnap.app@gmail.com</p>
