<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>隐私政策 — EmoSnap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#FAF6F0;--ink:#1A1612;--ink-mid:#4A3F35;--brand:#E8593A;--max:1140px;--paper:#FFFCF8;--line:rgba(26,22,18,0.07);--r-lg:26px}
    body{font-family:"Noto Sans SC",system-ui,sans-serif;font-feature-settings:"palt" 1;background:var(--bg);color:var(--ink);margin:0;padding:40px 12px;line-height:1.8}
    .wrap{width:100%;max-width:var(--max);margin:0 auto;background:transparent;padding:0 20px}
    h1{font-size:1.6rem;margin-bottom:12px}
    h2{margin-top:18px;color:var(--brand)}
    p,li{color:var(--ink-mid)}
    a{color:var(--brand)}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;box-shadow:0 8px 24px rgba(26,22,18,0.06)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>隐私政策（概要）</h1>
      <p>EmoSnap 以设备本地存储为核心，妥善处理您的照片与情绪记录。以下是本页面的简要说明，详细内容请参阅应用版隐私政策。</p>

      <h2>收集的信息</h2>
      <ul>
        <li>您记录的照片与文字（保存在您的设备本地）</li>
        <li>匿名化的应用使用统计数据</li>
        <li>广告所需的最少设备信息（仅在启用广告时）</li>
      </ul>

      <h2>使用目的</h2>
      <ul>
        <li>提供并改善应用功能</li>
        <li>分析使用情况以优化用户体验</li>
        <li>投放广告（仅在启用该功能时）</li>
      </ul>

      <p>如需了解数据处理、第三方共享、您的权利及联系方式的完整说明，请参阅<a href="privacy-app.html">应用版隐私政策（详细）</a>。</p>

      <p>联系方式：emosnap.app@gmail.com</p>
      <p><a href="index.html">← 返回顶部</a></p>
    </div>
  </div>
</body>
</html>
